name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test-vet-build:
    name: Windows test, vet, and adm-desktop smoke build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows Desktop artifact
        id: windows_desktop
        shell: pwsh
        run: |
          $tagSuffix = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagSuffix = "-$env:GITHUB_REF_NAME"
          }
          $desktopName = "adm-desktop$tagSuffix-windows-amd64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/build-desktop.ps1 -clean -trimpath -o $desktopName -OutputDir dist
          "desktop_name=$desktopName" >> $env:GITHUB_OUTPUT
          "desktop_artifact=adm-desktop$tagSuffix-windows-amd64" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.windows_desktop.outputs.desktop_artifact }}
          path: dist/${{ steps.windows_desktop.outputs.desktop_name }}
          if-no-files-found: error
          retention-days: 14
          archive: false

  cli-cross-build:
    name: CLI artifact (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: windows-test-vet-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            ext: ''
          - name: darwin-amd64
            os: macos-latest
            ext: ''
          - name: windows-amd64
            os: windows-latest
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI artifact
        id: cli_artifact
        shell: bash
        run: |
          set -euo pipefail
          tag_suffix=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_suffix="-${GITHUB_REF_NAME}"
          fi
          output="adm${tag_suffix}-${{ matrix.name }}${{ matrix.ext }}"
          artifact="adm${tag_suffix}-${{ matrix.name }}"
          mkdir -p dist
          go build -trimpath -o "dist/${output}" ./cmd/ai-dev-manager
          echo "output=${output}" >> "${GITHUB_OUTPUT}"
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.cli_artifact.outputs.artifact }}
          path: dist/${{ steps.cli_artifact.outputs.output }}
          if-no-files-found: error
          retention-days: 14
          archive: false

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows-test-vet-build
      - cli-cross-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > "SHA256SUMS-${GITHUB_REF_NAME}.txt"
          cat "SHA256SUMS-${GITHUB_REF_NAME}.txt"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-rc.* || "${GITHUB_REF_NAME}" == *-beta* || "${GITHUB_REF_NAME}" == *-alpha* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release for ${GITHUB_REF_NAME}." \
            "${prerelease[@]}"
